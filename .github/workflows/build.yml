name: build

on:
  push:
    branches: [main, develop]
  pull_request:
  # Startable by hand, which is what you need when a run never appears: a push or a pull
  # request event is the only other way in, and an event GitHub does not deliver cannot be
  # asked for again. Also the way to re-run against a branch after changing nothing.
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # See lint.yml: superseding is fine on a pull request, not on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is what we develop on, 17 is what we release for. 21 catches
        # anything that breaks in between.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The export converts through pandoc, and the one test that runs the whole
      # export end to end skips itself without it. A skipped test says nothing,
      # and says it quietly.
      - name: Install pandoc
        run: pandoc --version || { sudo apt-get update && sudo apt-get install -y pandoc; }
      # Same reason, for the specifications that assert what asciidoctor makes of the AsciiDoc
      # this project writes: whether a block is read as markup, whether an include lands a level
      # deeper, whether a table keeps its columns, and what an escaped character renders as.
      # Those are the only assertions that could have caught an include attribute spelled in a
      # way the directive does not read, or a column width AsciiDoc cannot parse.
      - name: Install asciidoctor
        run: asciidoctor --version || { sudo apt-get update && sudo apt-get install -y asciidoctor; }
      - run: ./mvnw -B -ntp verify

  sonar:
    name: SonarQube Cloud
    # push only. On a pull_request this job would run the PR's own Maven build
    # with SONAR_TOKEN in the environment, and a PR can change the build to
    # exfiltrate it. Guarding on an empty secret does not isolate untrusted code.
    # main only. develop is the working stream; the analysed state should be the
    # one that has been reviewed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Sonar needs the full history to attribute issues to authors and dates.
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Analyse
        if: env.SONAR_TOKEN != ''
        # sonar.qualitygate.wait makes the job fail on a failing gate. Without it
        # the scanner only submits the analysis and CI stays green regardless.
        run: ./mvnw -B -ntp verify sonar:sonar -Dsonar.qualitygate.wait=true
      - name: Skipped
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not set - skipping analysis. See docs/decisions.adoc."
