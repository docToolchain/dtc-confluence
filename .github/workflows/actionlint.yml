# Lints the GitHub Actions workflows themselves with actionlint
# (https://github.com/rhysd/actionlint): workflow syntax, expression contexts,
# and embedded shell (via shellcheck).
#
# Run through github/super-linter, mirroring apache/maven. There the detour is
# mandatory - the ASF allowed-actions policy permits GitHub-owned actions only.
# We have no such policy, so this can be swapped for the stand-alone actionlint
# action if the super-linter image ever becomes the slow part of CI.
name: actionlint

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # super-linter needs full history to resolve the commit range
          fetch-depth: 0
      # VALIDATE_GITHUB_ACTIONS restricts super-linter to actionlint; other
      # linters can be enabled later through further VALIDATE_* flags.
      - uses: github/super-linter/slim@b807e99ddd37e444d189cfd2c2ca1274d8ae8ef1 # v7
        env:
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_GITHUB_ACTIONS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
