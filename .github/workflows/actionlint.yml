# Lints the GitHub Actions workflows themselves with actionlint
# (https://github.com/rhysd/actionlint): workflow syntax, expression contexts,
# and embedded shell (via shellcheck).
#
# Run through super-linter, mirroring apache/maven. There the detour is mandatory:
# the ASF allowed-actions policy permits GitHub-owned actions only, which is why
# that PR uses github/super-linter - a fork of the project, two major versions
# behind. We have no such policy, so we point at the maintained upstream.
#
# If the image ever becomes the slow part of CI, a stand-alone actionlint action
# would be leaner; it just trades a large well-known action for a small less
# well-known one.
name: actionlint

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # super-linter needs full history to resolve the commit range
          fetch-depth: 0
      # VALIDATE_GITHUB_ACTIONS restricts super-linter to actionlint; other
      # linters can be enabled later through further VALIDATE_* flags.
      - uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_GITHUB_ACTIONS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
