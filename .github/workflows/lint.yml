# Lints everything that the Maven build does not: the workflows themselves
# (actionlint), YAML, XML, editorconfig conformance, shell, and leaked secrets.
#
# Run through super-linter, mirroring apache/maven. There the detour is
# mandatory: the ASF allowed-actions policy permits GitHub-owned actions only,
# which is why that PR uses github/super-linter - a fork of the project, two
# major versions behind. We have no such policy, so we use maintained upstream.
#
# Java and Groovy are deliberately NOT linted here. SonarQube Cloud analyses
# both, including Groovy, and super-linter's Java validator enforces
# google-java-format, which is not the style this project uses.
name: lint

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request run is fine - only the latest state matters. On main
  # it is not: cancelling leaves commits without a lint result, and a cancelled run
  # is easily mistaken for a failing one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint sources and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # super-linter needs full history to resolve the commit range
          fetch-depth: 0
      - uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          VALIDATE_XML: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_BASH: true
          VALIDATE_GITLEAKS: true
          YAML_CONFIG_FILE: .yamllint.yml
          EDITORCONFIG_FILE_NAME: .editorconfig-checker.json
          # Report into the job summary instead of commit statuses and PR
          # comments, so the workflow needs no write permission at all.
          MULTI_STATUS: false
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          # The Maven wrapper is generated by Maven. Its shell script is not ours
          # to fix, and mvnw.cmd is deliberately CRLF, see .gitattributes.
          FILTER_REGEX_EXCLUDE: '.*(mvnw|mvnw\.cmd|\.mvn/.*)'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
