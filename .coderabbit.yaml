# Configuration for the CodeRabbit review app.
# Reference: https://docs.coderabbit.ai/reference/yaml-template
#
# This repository is reviewed under CodeRabbit's open-source offering, which
# grants Team features without a paid plan but rate-limits reviews per hour,
# scaled by the repository's star count. For a repository as new as this one
# that is around one review per hour - measured: three pull requests opened
# within ten minutes produced one review and two "Review rate limited".
#
# So the budget is the scarce thing, and there are two ways to spend it well:
#
#   * Open pull requests as drafts (gh pr create --draft). A draft is not
#     reviewed automatically - reviews.auto_review.drafts defaults to false -
#     so CI runs while the budget stays untouched. Release them one at a time
#     with gh pr ready <n>, most important first.
#   * Ask for a review when the hour has passed, by commenting
#     "@coderabbitai full review" on the pull request. A rate-limited pull
#     request is not retried on its own.
#
# What is deliberately NOT done: excluding documentation from review. A
# decision entry that claims something nobody measured is as expensive to
# believe as a defect in the publisher, and the entries here are where the
# measurements are recorded. Documentation is reviewed; see the path
# instructions for what that means.

language: en-GB

tone_instructions: >-
  Be direct and specific. Name the input that triggers a defect and what it
  produces, rather than describing the code in general terms. Say when a finding
  is a guess. Prefer one well-argued finding over five uncertain ones.

reviews:
  # assertive rather than the default chill: this repository is a port of code
  # that has been in production for years, and the point of reviewing it is to
  # find what was carried across unnoticed.
  profile: assertive

  # Work happens on develop; main only receives releases. Without this, reviews
  # are skipped on every pull request here - which is what happened on #37.
  auto_review:
    enabled: true
    base_branches:
      - develop

  # Says which files were skipped and which comments were withheld, so a quiet
  # review can be told from one that had nothing to look at.
  review_details: true

  path_filters:
    # Generated by the build, not written by anyone.
    - '!**/target/**'
    # Transcripts of what a publish would send. They are regenerated with
    # -Dgolden.update=true and reviewed as a diff against the previous run; a
    # line-by-line review of the storage format they contain says nothing.
    - '!dtc-confluence-core/src/test/resources/publisher/*.txt'

  path_instructions:
    - path: 'dtc-confluence-core/src/main/groovy/**'
      instructions: >-
        This is the Groovy that has not been ported to Java yet. An unset
        configuration entry here is an empty ConfigObject rather than null, and
        Groovy truth treats an empty string, a zero and a false as absent - so a
        check for one shape of absence usually misses the other. Watch for that
        and for values coerced with "as String", which turns an unset entry into
        the literal "[:]".
    - path: '**/*.adoc'
      instructions: >-
        These documents are the project's memory: decisions.adoc records what
        was decided and why, releasing.adoc the procedure, README.adoc what the
        tool does. Review them for claims rather than for prose. A sentence
        that states a fact about the software - a version, a limit, a
        measurement, an API's behaviour - either names how it was established
        or should be challenged. Check that cross-references resolve, that an
        instruction can be followed literally as written, and that nothing
        contradicts an earlier entry; where an entry describes code, say so if
        the code no longer does that. AsciiDoc conventions here: one sentence
        per line, '*' for lists, 'xref:' between documents, four-hyphen source
        blocks.
    - path: '**/*Spec.groovy'
      instructions: >-
        Ask whether each test would fail if the behaviour it describes were
        wrong. Fixtures copied from a wrong assumption are the usual way a green
        test proves nothing here; where a fixture claims to be what a tool
        emits, say so if it is not.
